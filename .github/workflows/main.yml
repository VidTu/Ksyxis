name: 'Build (Main)'
permissions: { }
concurrency:
  group: 'main'
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
jobs:
  main:
    name: 'Build (Main)'
    runs-on: 'ubuntu-26.04'
    timeout-minutes: 15
    permissions:
      contents: 'write'
    env:
      GRADLE_OPTS: '-Dorg.gradle.java.installations.auto-download=false'
    steps:
      - name: 'Checkout'
        timeout-minutes: 1
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup JDK (8)'
        timeout-minutes: 1
        uses: 'actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad' # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '8.0.512'
      - name: 'Setup JDK (25)'
        timeout-minutes: 1
        uses: 'actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad' # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25.0.5'
      - name: 'Setup Gradle'
        timeout-minutes: 5
        uses: 'gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c' # v6.4.1
        with:
          # Generate with either:
          # 1. Linux/macOS/Unix (OpenSSL): openssl rand -base64 32
          # 2. Linux/macOS/Unix: cat /dev/random | head -c32 | base64
          # 3. Windows (PowerShell): $bytes=New-Object byte[] 32;[Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes);[Convert]::ToBase64String($bytes)
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: 'generate-and-submit'
      - name: 'Build (Main)'
        timeout-minutes: 15
        run: './gradlew assemble'
      - name: 'Upload JAR'
        timeout-minutes: 1
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          path: 'build/libs/*.jar'
          if-no-files-found: 'error'
          archive: false
      - name: 'Build Debug (Main)'
        timeout-minutes: 15
        run: './gradlew -Pru.vidtu.ksyxis.debug=true assemble'
      - name: 'Upload Debug JARs'
        timeout-minutes: 1
        uses: 'actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9' # v7.0.2
        with:
          name: 'Debug JARs'
          path: |
            build/libs/jar/*.jar
            build/libs/javadocJar/*.jar
            build/libs/sourcesJar/*.jar
          compression-level: 9
          if-no-files-found: 'error'
